        footage: 0.28
        stock: 0.126
        card: 0.131
        collage: 0.047
        motion: 0.042
        kling: 0.039
      pacing:
        hook:
        - 2.6
        - 4.8
        middle:
        - 2.7
        - 5.1
        tail:
        - 2.5
        - 4.6
        shots_per_min: 12.2
        p10: 1.5
        p90: 8.96
      on_screen_text:
        share: 75.4
        size_pct:
          medium: 26.4
          small: 26.8
          none: 24.6
          large: 18.7
        pos_pct:
          center: 51.4
          top: 24.6
          bottom: 12.9
          none: 6.1
          left: 0.85
          right: 0.8
        bg_pct:
          light: 53.2
          dark: 33.0
          color: 14.4
        face_share: 26.1
