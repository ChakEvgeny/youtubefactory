  work:
    id: work
    niche: careers_country_compare_en
    primary: false
    subniche: Как на самом деле устроены работа и оплата труда
    positioning_rule: >-
      В публичном позиционировании — названии, баннере, описании, ключевых
      словах — никакой привязки к конкретным странам и к их числу. Сравнение
      стран остаётся приёмом внутри ролика, а не обещанием канала: привязка
      закрывает будущие темы.
    tagline: How work actually pays. The real numbers.
    voice_id: HqvJCG2GILndiW8EU4Pr
    voice_note: профессиональный клон голоса Евгения «Chakster true» (с 2026-09-23;
      прежний instant-клон «Mr. Chakster» xC3KAv6MokCOMtCm8mpW снят). Темп прежнего
      клона был 143 слова в минуту; у нового НЕ ЗАМЕРЕН — хронометраж первого
      ролика на нём считать из реального звука, а не из этой цифры
    target_minutes:
    - 10
    - 15
    markets_note: >-
      Рынки первых выпусков (US, UK, CA, AU) — это выбор данных и аудитории,
      а не позиционирование. В описание канала и теги не выносятся.
    markets:
    - US
    - UK
    - CA
    - AU
    scaling: автодубляж YouTube; половина рубрик без страновой привязки,
      название канала без географии
    palette:
      navy: '#1B2A5E'
      ochre: '#C89A3C'
      red: '#E4533A'
      paper: '#F2ECE0'
    palette_rules:
      inks_max: 3
      red_max_share: 0.10
      forbidden:
      - бирюза
      - пурпур
      - маджента
      - кислотный жёлтый
      - зелёный
      - серый и лиловый как четвёртая краска
      - чёрный как основная масса
      check: доля вне палитры <= 5%, серого <= 7%, red <= 10%
      grey_threshold_note: >-
        Порог серого поднят с 4% до 7% 2026-09-20: на интерьерных кадрах
        полутон стен и оконных рам даёт ложное срабатывание (pose_desk 5.5%
        при визуально чистой палитре).
    visual_style: 'Трёхкрасочный ризограф на кремовой бумаге: плотный контур одной
      толщины, полутоновая растровая заливка, смещение слоёв на 1-2 px, зерно бумаги.
      Заливки только SOLID navy или SOLID ochre — полутон низкой плотности читается
      серым. Фигуры без лиц, кроме самого ведущего. Числа и подписи рисует Remotion
      поверх кадра, модель даёт только плиту.'
    character:
      canon: styletest/riso_lock2_host_thumb.jpg
      note: канон похожести; во всех кадрах это один и тот же человек — цвет волос,
        очки и пропорции лица не меняются
      hair: рыжие, короткие, зачёсаны вверх и назад с высокого лба; SOLID ochre
        с navy-контуром
      beard: короткая полная борода, SOLID ochre, к подбородку светлеет за счёт
        просвета бумаги
      glasses: крупные прямоугольные очки, оправа navy, дужка red
      clothing: однотонная футболка с круглым воротом, ВСЕГДА SOLID ochre
        #C89A3C — никакой navy-футболки ни в одном кадре
      skin: кремовая бумага с полутоновым растром, без телесного цвета
      face: единственное лицо на канале; всем остальным фигурам головы оставлять пустыми
      hands: кисти рисуются целиком и правильно — ровно пять пальцев, включая
        большой; кадры с руками проверяются отдельно
    assets_note: >-
      Это БРЕНДОВЫЕ ассеты канала (аватар, баннер, обложки), а не библиотека
      кадров для роликов. Кадры роликов не берутся из готового набора: стадия
      stills генерирует новый кадр под каждый шот из его фразы.
    assets:
      avatar: brand/avatar_800.png
      banner: brand/banner_2560x1440.png
      banner_safezone_check: brand/banner_safezone_check.png
      poses: brand/pose_*.jpg
      thumb_template: brand/thumb_template_1280x720.png
      approval_sheet: brand/approval_sheet.jpg
      check: brand/check.json
      generator: scripts/character_sheet.py
    shirt_rule: >-
      Футболка всегда SOLID ochre #C89A3C, без исключений. Ранее допускался
      navy на светлых фонах — правило снято, цвет одежды входит в канон.
    thumb_palette:
    - '#1B2A5E'
    - '#C89A3C'
    - '#E4533A'
    thumb_rules:
      big_text: true
      max_words: 4
      faces: true
      host_share: 0.33
      news_chrome: false
    style_prompt: >-
      A three-ink risograph print on cream paper. Ink one deep navy #1B2A5E for
      outlines, dark masses and the lower third; ink two warm ochre #C89A3C for the
      main colour and all light; ink three signal red #E4533A as an accent only,
      never more than a tenth of the frame. Dense confident outlines of one weight,
      halftone dot screens for tone, deliberate 1-2 px misregistration, visible
      paper grain. Fills are solid ink, never a pale halftone. Никакого текста в
      кадре: no text, no letters, no numbers, no handwriting, no labels, no
      signage. Формулировка «no legible letters» не годится — она разрешает
      нечитаемые каракули, модель рисует именно их. Предметы, которые просят
      букв (печатная страница, список, ежедневник, реестр), в промпт не ставим:
      заменяем на геометрию, всё читаемое кладёт Remotion поверх кадра.
    author:
      name: Evgenii Chak
      based_in: Лиссабон
      voice_id: HqvJCG2GILndiW8EU4Pr
      stance: >-
        Восемь лет по ту сторону найма. Говорит от первого лица как человек,
        который это делал, а не как эксперт-комментатор.
      track:
      - IT-рекрутер, 2017-2018
      - рекрутер, затем Head of Recruitment, 2018-2025; команда 8-10 senior-рекрутеров,
        найм в EU, LATAM, US, MENA, Asia
      - Recruitment Consultant в геймдеве, роли уровня Head и C-level
      - HR People Partner с февраля 2025
      hands_on:
      - писал вакансии и назначал зарплатные вилки
      - вёл калибровки и performance-циклы
      - строил аналитику найма (time-to-hire, cost-per-hire)
      - консультировал руководителей по увольнениям, конфликтам и мотивации
      - писал HR-политики, работал с Legal и Finance по контрактам
      education: бакалавр социологии, СПбГУ
      products:
      - бесплатная энциклопедия профессий
      - сервис, собирающий реалистичный роадмап входа в профессию
      rules:
      - 'где есть личный опыт — отдельный блок «взгляд изнутри», помечать [INSIDE: ...]'
      - 'не выдумывать истории, цифры и компании; нужен случай — ставить заглушку
        [INSIDE — нужен твой пример: о чём]'
      - 'работодателей не называть: «в компаниях, где я работал», «в командах, которые я вёл»'
      - без формул вроде «as a recruiter, I can tell you»; суждения и несогласие допустимы
      - продукты упоминать редко и только по делу
    script_system_prompt: >-
      Ты пишешь сценарий для канала Terms of Employment. Сценарий идёт от первого
      лица Евгения Чака — человека, который восемь лет работал по ту сторону найма:
      IT-рекрутер, затем Head of Recruitment команды из 8-10 senior-рекрутеров с
      наймом в EU, LATAM, US, MENA и Asia, затем Recruitment Consultant в геймдеве
      на роли уровня Head и C-level, с февраля 2025 HR People Partner. Он писал
      вакансии и назначал зарплатные вилки, вёл калибровки и performance-циклы,
      строил аналитику найма, консультировал руководителей по увольнениям и
      конфликтам, писал HR-политики, работал с Legal и Finance по контрактам.
      Он не меняет профессию сам — он строит продукты для тех, кто меняет, поэтому
      формулы «я прошёл этот путь» в сценарии быть не должно.
      Пиши так, как говорит человек, который это делал: по делу, со своими
      суждениями, с правом не согласиться с общепринятым. Запрещены обороты
      «as a recruiter, I can tell you» и любая поза эксперта-комментатора.
      Там, где тема пересекается с его опытом, ставь отдельный блок «взгляд
      изнутри» и помечай его [INSIDE: о чём блок] — что реально происходит в
      комнате, где принимают решение, как это выглядит со стороны нанимателя.
      НИКОГДА не выдумывай за него истории, цифры, имена людей и названия
      компаний: если блоку нужен конкретный случай из его практики, оставь
      заглушку [INSIDE — нужен твой пример: о чём] и иди дальше.
      Названия работодателей не упоминаются никогда — только «в компаниях, где я
      работал» и «в командах, которые я вёл». Продукты упоминай редко и только по
      делу. Всё остальное — факты из брифа со ссылками, без единой фразы без
      источника.
    shots_rule: >-
      Кадр генерируется под каждый шот, как на остальных каналах: один шот —
      один новый кадр по своему image_prompt. Переставлять готовые картинки по
      ролику нельзя. Библиотека допустима только для канона персонажа (лист
      героя как референс похожести) и для карт четырёх стран; ведущего при этом
      тоже рисуем заново в каждой сцене, а не берём позу из набора.
      Повторы режет реестр перцептивных хэшей SeenFrames (pipeline/util.py):
      похожий кадр отбраковывается и перерисовывается с другой композицией.
      Стиль держится жёстко: riso_lock, палитра navy/ochre/red/paper, персонаж
      по канону, vision-сверка каждого кадра.
    gen:
      enabled: true
      per_shot: true
      reuse_library: false
      hero_ref: brand/canon_host.jpg
      seen_frames_threshold: 8
      max_cost_eur: 20
    typography:
      body: Courier Prime Bold
      body_use: >-
        Весь текст внутри роликов: числа, цитаты из законов, выноски, подписи
        к картам и схемам. Машинопись читается как документ — это и есть предмет
        канала.
      brand: Special Elite
      brand_use: заставка канала и финалка, больше нигде
      thumbs: Archivo Black
      thumbs_use: >-
        Обложки и баннер. Машинописный в миниатюре тоньше и хуже читается —
        решение Евгения 2026-09-21, жирный гротеск остаётся.
      typewriter_effect: >-
        Посимвольное появление со звуком печати — только для цитат из законов,
        пунктов контракта и ключевых цифр, 2-4 раза за ролик. Весь остальной
        текст появляется тихо, без звука: если стучит всё подряд, приём
        перестаёт работать.
    infographic_rule: >-
      Инфографика — предметом ПОВЕРХ кадра, не отдельным экраном. Отдельные
      экраны, на которых написаны слова из дикторского текста, — брак: зритель
      эту фразу уже слышит, читать её нечего. Числа и подписи рисует Remotion
      (сцена WorkChip, motion/src/scenes/WorkChip.tsx), рендер PNG-секвенцией с
      альфой и наложение поверх видео. Ставить редко и только там, где число
      важно: на хуке в 29 секунд — одна фишка.
    infographic_scene: motion/src/scenes/WorkChip.tsx
    image_model: gemini-3.1-flash-image
    script_bible: docs/work_channel.md
