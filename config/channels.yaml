    - '#FFFFFF'
    - '#0B0F14'
    thumb_rules:
      big_text: true
      max_words: 3
      faces: false
      brand_wordmark: true
      news_chrome: false
    motion_share:
    - 0.2
    - 0.3
    grade:
      contrast: 1.06
      saturation: 0.85
      brightness: -0.02
      grain: 5
    title_templates:
    - '{BRAND} Lost ${SUM} to One {ORDINARY ROLE} With a {EVERYDAY OBJECT}'
    - The {ROLE} Who {IMPOSSIBLE ACTION} From {SUPERLATIVE SYSTEM}
    - One Fake Company in {PLACE} Billed {BRAND} ${SUM} — And They Paid
    - The Man Who Tricked {INSTITUTION} Into {DOING THE CRIME FOR HIM}
    hook_types:
