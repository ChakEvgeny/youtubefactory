    id: space
    niche: space_science
    subniche: Планеты и разведка миссий
    voice_id: CwhRBWXzGAHq8TQ4Fs17
    target_minutes:
    - 12
    - 14
    visual_style: 'AI-визуал плюс сток: виды планет, поверхностей и аппаратов вперемешку с реальными кадрами миссий
      и телескопов.'
    thumb_palette:
    - '#0B0B10'
    - '#FF7A1A'
    - '#2E7BE6'
    thumb_rules:
      big_text: true
      max_words: 4
      faces: false
      news_chrome: false
    honesty_rules:
    - Никаких имитаций плашек NASA, ESA, CNN, BREAKING NEWS и логотипов агентств.
    - Формулировки «NASA Confirmed» и «Scientists Just Proved» — только если ровно это утверждение есть в brief.md
      со ссылкой на источник.
    - 'Гипотеза называется гипотезой: «may», «could», а не «confirmed».'
    motion_share:
    - 0.1
    - 0.15
    grade:
      contrast: 1.1
      saturation: 0.95
      brightness: -0.02
      grain: 5
    title_templates:
    - '[Object]: [Adjective Description]'
    - '[Question Word] [Subject/Action]?'
    - '[How/Why] [Subject] [Verb]'
    - '[Subject] Just [Verb] [Discovery]'
    hook_types:
    - Невозможное открытие — то, чего по науке быть не должно
    - Шокирующая цифра космического масштаба
    - Антиутопический сценарий на другой планете
    - 'Парадокс: произошло вопреки законам'
    kling_bias: high
  disasters:
