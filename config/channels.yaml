    used_by: disasters
  - name: Will
    id: bIHbv24MWmeRgasZH58o
    note: молодой американец, разговорный
    used_by: null
  - name: Daniel
    id: onwK4e9ZLuTAKqWW03F9
    note: британец, ровный broadcaster
    used_by: business
  words_per_minute: 150
  scene_seconds:
  - 8
  - 20
  kling_per_video:
  - 3
  - 5
  max_same_source_in_row: 2
  loudness_lufs: -14
  narration_speed: 1.08
  narration_tempo: 1.052
  voice_model: eleven_v3
  voice_stability: 0.35
  voice_style: 0.6
  voice_tags:
  - pause
  - thoughtful
  - firmly
  - quietly
  - sighs
  shot_seconds:
  - 2.7
  - 5.1
  silence_max: 1.0
  silence_to: 0.95
  chunk_crossfade_ms: 50
  hook_max_sec: 18
  jl_cut_ms: 150
  duck_db: -12
  kling_enabled: false
  shot_budget:
    screens: 0.336
    footage: 0.28
    stock: 0.126
    card: 0.131
    collage: 0.047
    motion: 0.042
    kling: 0.039
  vision_candidates: 5
  motion_max_seconds: 8
  subtitles: false
  resolution:
  - 1920
  - 1080
  fps: 30
  anti_slop:
    banned_phrases:
    - in this video
    - let's dive in
    - buckle up
    - without further ado
    - we've all been there
    - little did they know
    - the results will shock you
    - stay tuned
    - here's the kicker
    - game changer
    - at the end of the day
    - it's important to note
    rules:
    - 'Никаких списков-перечислений вслух: «первое, второе, третье» — это текст, а не речь.'
    - 'Конкретика вместо оценок: не «огромная сумма», а «$4.3 млрд за квартал».'
    - Не больше одного прилагательного на существительное.
    - Никаких симметричных парных конструкций («не просто X, а Y») чаще раза на ролик.
    - Каждый фактический тезис опирается на пункт brief.md с источником.
    - 'Разговорный английский: сокращения (it''s, doesn''t), короткие предложения.'
    - Каждый термин (pre-pack, tariff, supply chain, cyberattack) объясняется одной фразой прямо внутри истории.
  gen:
    enabled: false
    max_cost_eur: 120
    eur_per_usd: 0.92
    veo_model: veo-3.1-fast-generate-preview
    veo_resolution: 720p
    t2v_seconds: 6
    runway_model: gen4.5
    runway_ratio: 1280:720
    kling_model: kling-v2-1-master
    fallback_order:
    - veo
    - runway
    - kling
    ambient_gain_db: -18
    negative_prompt: text, captions, logos, watermarks, brand names, celebrity, recognizable person, cartoon, anime,
      oversaturated, lens flare
    rules:
    - (а) реальное фото субъекта (коллаж в режиме photo) -> Runway image-to-video, движение камеры, 4–6 с
    - (б) реального нет, сцена атмосферная/обобщённая -> Veo 3.1 text-to-video со звуком, ambient 10–15%
    - (в) провайдер упал / нет ключа -> Kling
    - 'никогда: узнаваемые объекты, здания конкретных компаний, реальные люди — промпт переписывается в обобщённый
      и проверяется'
    front_load_sec: 60
  shot_budget_gen:
    screens: 0.31
    collage: 0.15
    i2v: 0.15
    t2v: 0.12
    card: 0.12
    motion: 0.06
    stock: 0.05
    kling: 0.0
  sfx:
    enabled: true
    gain_db: -9
    at:
    - dip
    - hook_cuts
    - turn
    - riser
    whoosh: short cinematic whoosh transition, airy, clean, no music
    hit: deep soft cinematic impact hit, low thud, short tail, no music
    riser: cinematic tension riser building for six seconds, no melody
    riser_sec: 6
  music_from: start
  hook_fx: punch
channels:
  business:
    id: business
    niche: business_breakdowns
    primary: true
    subniche: Крах европейских и британских брендов
    voice_id: onwK4e9ZLuTAKqWW03F9
    target_minutes:
    - 12
    - 15
    format_reference: Mondo Startups (8 180 подписчиков, каналу 13 месяцев, v/s до 35) — обложка строится как стилизованный
      вордмарк бренда плюс 2-3 слова приговора. Ни лиц, ни плашек новостных каналов, ни имитации эфира.
    visual_style: 'Сток плюс программная графика: архив производств и магазинов, биржевые графики и падающие стрелки
      рисуются Remotion из чисел сценария.'
    thumb_palette:
    - '#D0021B'
    - '#FFFFFF'
    - '#111111'
    thumb_rules:
      big_text: true
      max_words: 3
      faces: false
      brand_wordmark: true
      news_chrome: false
    motion_share:
    - 0.2
    - 0.3
    grade:
      contrast: 1.06
      saturation: 0.82
      brightness: -0.015
      grain: 7
    title_templates:
    - '[Company] Is Collapsing'
    - Why [Company] Failed
    - '[Number] Mistakes That Killed [Company]'
    - Can [Company] Actually Survive This?
    - '[Status] Then: [Company] Now...'
    hook_types:
    - Шокирующая цифра, противоречащая ожиданию
    - Парадокс успеха-провала
    - Отрицание общего мнения
    - Обещание раскрыть скрытую причину
    kling_bias: low
    format:
