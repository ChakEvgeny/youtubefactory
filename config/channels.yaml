    - 14
    visual_style: 'Сток документальных кадров плюс программные схемы: разрезы конструкций, последовательность отказа,
      графики нагрузок рисуются Remotion.'
    thumb_palette:
    - '#7A4B23'
    - '#FFFFFF'
    - '#1C6DD0'
    thumb_rules:
      big_text: true
      max_words: 4
      faces: false
      news_chrome: false
    honesty_rules:
